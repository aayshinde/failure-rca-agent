# Run `python run_pipeline.py` on the host first (it creates data/, models/ and results/).
# Then:  docker compose up --build
#   API      http://localhost:8000/docs
#   Qdrant   http://localhost:6333/dashboard
#   MLflow   http://localhost:5000
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
    depends_on: [qdrant]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes:
      - qdrant_storage:/qdrant/storage

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports: ["5000:5000"]
    working_dir: /mlflow
    volumes:
      - ./:/mlflow
    command: mlflow ui --backend-store-uri sqlite:///mlflow.db --host 0.0.0.0 --port 5000

volumes:
  qdrant_storage:
